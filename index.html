<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择题练习系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>选择题练习系统</h1>
            <p class="subtitle">离线练习，随时提升</p>
            <p>Ver1.7-Beta Author:Troy  问题反馈邮箱: <u>troywang@buaa.edu.cn</u></p>
            <button class="update-log-btn" id="updateLogBtn">更新日志</button>
            <button class="overall-progress-btn" id="overallProgressBtn">整体进度</button>
            <button class="exam-btn" onclick="window.location.href='exam/exam.html'">考试模式</button>
        </header>
        
        <div class="main-content">
            <div class="navigation-panel">
                <h2 class="panel-title">题目导航</h2>
                <ul class="question-grid" id="questionNav">
                    <!-- 题目导航圆圈将通过JavaScript动态生成 -->
                </ul>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="correctProgress">0/0</div>
                        <div class="stat-label">正确/已做</div>
                    </div>
                    <div class="stat-item">
                        <div class="circular-progress">
                            <div class="progress-ring">
                                <svg width="60" height="60">
                                    <circle class="progress-ring-circle" stroke="#4CAF50" stroke-width="4" 
                                            fill="transparent" r="26" cx="30" cy="30"/>
                                </svg>
                                <div class="progress-text" id="completionRate">0%</div>
                            </div>  
                        </div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>

                <!-- 原 actions 区域 -->
                <div class="actions">
                    <button class="btn-secondary" id="resetBtn">重置进度</button>
                    <button class="btn-success" id="exportProgressBtn">导出进度</button>  <!-- 替换为导出进度按钮 -->
                </div>

                <!-- 原 import-section 区域，移除导入错题按钮和相关隐藏输入 -->
                <div class="import-section">
                    <h3>导入题库</h3>
                    <div class="dropdown">
                        <select id="one" class="dropdown-select">
                            <option value="">选择题库</option>
                            <option value="ppl">私照</option>
                            <option value="cpl">商照</option>
                            <option value="ins">仪表</option>
                        </select>
                    </div>
                    <div class="dropdown">
                        <select id="two" class="dropdown-select">
                            <option value="">选择章节</option>
                        </select>
                    </div>
                    <button class="btn-primary" id="importBtn">导入题库</button>
                    <!-- 已删除导入错题按钮及相关输入 -->
                </div>

                <!-- 在页面任意位置（例如 body 末尾）添加隐藏文件输入，用于导入进度 -->
                <input type="file" id="progressFileInput" accept=".json" style="display: none;">
            </div>
            
            <div class="question-panel">
                <h2 class="panel-title">题目
                    <div style="width: 25%;display: inline;float: right;">
                    自动跳转
                    <label class="switch">
                        <input type="checkbox" id="toggleSwitch">
                        <span class="slider">
                            <span class="slider-text off"></span>
                            <span class="slider-text on"></span>
                        </span>
                    </label>
                    </div>
                </h2>
                
                <div class="question-content" id="questionContent">
                    <div class="question-title">题目 <span id="currentQuestionNumber">1</span></div>
                    <div class="question-text" id="questionText">请先导入题库开始练习</div>
                    <img class="question-image" id="questionImage" src="" alt="" style="display: none;">
                    
                    <div class="options" id="optionsContainer">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </div>
                    
                    <div class="explanation" id="explanation">
                        <div class="explanation-title">题目解析</div>
                        <div id="explanationText"></div>
                        <img class="question-image" id="explanationImage" src="" alt="" style="display: none; margin-top: 10px;">
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn-secondary" id="prevBtn">上一题</button>
                    <button class="btn-primary" id="nextBtn">下一题</button>
                </div>
                
                <div class="completion-message" id="completionMessage">
                    <div class="completion-title">练习完成！</div>
                    <div class="result-stats">您的正确率是：<span id="finalRate">0%</span></div>
                    <p>您已经完成了所有题目，可以导出错题进行复习。</p>
                    <button class="btn-success" id="reviewBtn">查看错题</button>
                </div>
            </div>
        </div>
    </div>

<script src="dataManager.js"></script>
<script src="uiManager.js"></script>
<script src="utils.js"></script>
<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="ai-sidebar.js"></script>
<script src="timer-plugin.js"></script>
<script src="progressImportExport.js"></script>
<script src="cloudSync.js"></script>
</body>
</html>
